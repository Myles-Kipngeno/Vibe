name: android app

# Builds the keyboard on every change to it and publishes the APK at one
# fixed link, so it can be installed on the phone without a cable:
#   https://github.com/Myles-Kipngeno/Vibe/releases/download/app-latest/vibe.apk
#
# The APK is signed with the same key as the builds made on the developer's
# PC (stored as the ANDROID_SIGNING_KEYSTORE_B64 secret). Android only installs
# an update signed with the key already on the phone -- a different key would
# mean uninstalling first, and losing every chat's memory with it.

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/android-release.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-release
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Use the phone's signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_SIGNING_KEYSTORE_B64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::ANDROID_SIGNING_KEYSTORE_B64 is not set; an APK signed with another key would not install over the phone's."
            exit 1
          fi
          mkdir -p ~/.android
          echo "$KEYSTORE_B64" | base64 -d > ~/.android/debug.keystore

      - name: Test and build
        working-directory: android
        env:
          # Every published build is newer than the last, so the phone offers it as an update.
          VIBE_VERSION_CODE: ${{ github.run_number }}
        run: ./gradlew testDebugUnitTest assembleDebug --console=plain

      - name: Publish at the fixed link
        env:
          GH_TOKEN: ${{ github.token }}
          RUN: ${{ github.run_number }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk vibe.apk
          gh release delete app-latest --yes --cleanup-tag || true
          gh release create app-latest vibe.apk \
            --title "Vibe app, build $RUN" \
            --notes "Open this on the phone to update Vibe: https://github.com/${{ github.repository }}/releases/download/app-latest/vibe.apk

          Built from ${{ github.sha }}. Installs over the existing app and keeps its data." \
            --target "${{ github.sha }}" \
            --latest
