name: android app

# Builds the keyboard on every change to it and publishes the APK at one
# fixed link, so it can be installed on the phone without a cable:
#   https://github.com/Myles-Kipngeno/Vibe/releases/download/app-latest/vibe.apk
#
# The APK is signed with the same key as the builds made on the developer's
# PC (stored as the ANDROID_SIGNING_KEYSTORE_B64 secret). Android only installs
# an update signed with the key already on the phone -- a different key would
# mean uninstalling first, and losing every chat's memory with it.

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/android-release.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-release
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Use the phone's signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_SIGNING_KEYSTORE_B64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::ANDROID_SIGNING_KEYSTORE_B64 is not set; an APK signed with another key would not install over the phone's."
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/vibe.keystore"
          echo "VIBE_SIGNING_KEYSTORE=$RUNNER_TEMP/vibe.keystore" >> "$GITHUB_ENV"
          # Published builds start at 101, above anything built on the PC.
          echo "VIBE_VERSION_CODE=$((100 + ${{ github.run_number }}))" >> "$GITHUB_ENV"

      - name: Test and build
        working-directory: android
        run: ./gradlew testDebugUnitTest assembleDebug --console=plain

      - name: Refuse to publish an APK the phone would reject
        # SHA-256 of the certificate on the phone's current Vibe. Public, not a secret.
        env:
          EXPECTED: 5df7563288cd1a87bdfad48146b42effd6c570ce7f0c7d7f64bc048d24a1e346
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          ACTUAL=$("$APKSIGNER" verify --print-certs android/app/build/outputs/apk/debug/app-debug.apk | grep -m1 "SHA-256 digest" | awk '{print $NF}')
          echo "signed with: $ACTUAL"
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "::error::Signed with the wrong key ($ACTUAL); it would not install over the phone's Vibe."
            exit 1
          fi

      - name: Publish at the fixed link
        env:
          GH_TOKEN: ${{ github.token }}
          RUN: ${{ github.run_number }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk vibe.apk
          gh release delete app-latest --yes --cleanup-tag || true
          gh release create app-latest vibe.apk \
            --title "Vibe app, build $RUN" \
            --notes "Open this on the phone to update Vibe: https://github.com/${{ github.repository }}/releases/download/app-latest/vibe.apk

          Built from ${{ github.sha }}. Installs over the existing app and keeps its data." \
            --target "${{ github.sha }}" \
            --latest
